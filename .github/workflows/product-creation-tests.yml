name: E2E Tests

on:
  # make this workflow reusable and take in marketplace version as input
  workflow_call:
    inputs:
        use-marketplace-version:
          description: 'Should this use marketplace version of the plugin'
          required: false
          type: boolean
          default: false
  workflow_dispatch:
    inputs:
        use-marketplace-version:
          description: 'Should this use marketplace version of the plugin'
          required: false
          type: boolean
          default: false
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run daily at 8am UTC (only runs when required secrets are configured)
    - cron: '0 8 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test environment configuration
  TEST_SITE_HOST: ${{ secrets.TEST_SITE_HOST }}
  WORDPRESS_PATH: '/tmp/wordpress'
  WP_DEBUG_LOG: '/tmp/wordpress/wp-content/debug.log'
  WC_LOG_PATH: '/tmp/wordpress/wp-content/uploads/wc-logs/'
  PLUGIN_PATH: '/tmp/wordpress/wp-content/plugins/facebook-for-woocommerce'
  FB_E2E_TEST_COOKIE_NAME: 'facebook_test_id'
  FB_E2E_LOGGER_PATH: '/tests/e2e/helpers/php/event-logger.php'
  FB_E2E_CAPTURED_EVENTS_DIR: '/tests/e2e/helpers/captured-events'
  WP_CUSTOMER_USERNAME: customer
  WP_CUSTOMER_PASSWORD: Password@54321
  WORDPRESS_URL: http://${{ secrets.TEST_SITE_HOST }}:8080
  TEST_PRODUCT_URL: '/product/testp/'
  TEST_CATEGORY_URL: '/product-category/uncategorized/'
  TEST_FBCLID: 'IwAR123TestClickId456'
  WP_USERNAME: admin
  WP_PASSWORD: admin
  PIXEL_EVENT_TIMEOUT: 30000
  PAGE_LOAD_TIMEOUT: 120000

  # Customer Billing/Shipping Address
  WP_CUSTOMER_EMAIL: 'customer@test.com'
  TEST_USER_FIRST_NAME: Test
  TEST_USER_LAST_NAME: Customer
  TEST_USER_ADDRESS_1: '123 Test Street'
  TEST_USER_ADDRESS_2: ''
  TEST_USER_CITY: 'San Francisco'
  TEST_USER_STATE: CA
  TEST_USER_POSTCODE: '94102'
  TEST_USER_COUNTRY: US
  TEST_USER_PHONE: '4155551234'

  # Store Configuration
  STORE_ADDRESS: '123 Test Street'
  STORE_CITY: 'Test City'
  STORE_COUNTRY: 'US:CA'
  STORE_POSTCODE: '12345'
  STORE_CURRENCY: USD

  # Error Whitelist (pipe-separated list of allowed non-critical errors)
  ERROR_WHITELIST: 'WC_Facebook_Google_Product_Category_Fields is not defined'

jobs:
  # Job to check if secrets are configured and emit warning if not
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      secrets-configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check if required secrets are configured
        id: check
        env:
          TEST_SITE_HOST: ${{ secrets.TEST_SITE_HOST }}
          FB_TEST_META_BUSINESS_ASSETS: ${{ secrets.FB_TEST_META_BUSINESS_ASSETS }}
          EVENT_NAME: ${{ github.event_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$TEST_SITE_HOST" ] && [ -n "$FB_TEST_META_BUSINESS_ASSETS" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "✅ Required secrets are configured"
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            # Fail if this is a scheduled run on the facebook repository
            if [ "$EVENT_NAME" = "schedule" ] && [ "$REPO_OWNER" = "facebook" ]; then
              echo "::error title=E2E Tests Failed::Scheduled run on facebook repository but required secrets (TEST_SITE_HOST, FB_TEST_META_BUSINESS_ASSETS) are not configured."
              exit 1
            fi
            echo "::warning title=E2E Tests Skipped::E2E tests require TEST_SITE_HOST and FB_TEST_META_BUSINESS_ASSETS secrets to be configured. After merge, E2E tests will run daily to validate functionality."
          fi

  # Job to resolve currently supported WP and WC versions from the plugin file
  resolve-versions:
    runs-on: ubuntu-latest
    outputs:
      wp-supported: ${{ steps.versions.outputs.wp-supported }}
      wc-supported: ${{ steps.versions.outputs.wc-supported }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Read tested up to versions from plugin file
        id: versions
        run: |
          WP_VERSION=$(grep -oP '^\s*\*\s*Tested up to:\s*\K\S+' facebook-for-woocommerce.php)
          WC_VERSION=$(grep -oP '^\s*\*\s*WC tested up to:\s*\K\S+' facebook-for-woocommerce.php)
          echo "wp-supported=$WP_VERSION" >> $GITHUB_OUTPUT
          echo "wc-supported=$WC_VERSION" >> $GITHUB_OUTPUT
          echo "Resolved versions — WP: $WP_VERSION, WC: $WC_VERSION"

  e2e-tests:
    name: E2E Tests - ${{ matrix.version-label }} - ${{ matrix.test-group }}
    needs: [check-secrets, resolve-versions]
    if: ${{ needs.check-secrets.outputs.secrets-configured == 'true' }}
    # Run every shard on the standard GitHub-hosted runner. We previously
    # pinned plugin-events/product-crud to a `4-core-ubuntu-22.04` larger-runner
    # pool, but that label isn't provisioned for this repo, so those jobs queued
    # indefinitely and were cancelled ~24h later by the next scheduled run —
    # never actually executing. The mysql:8.0 service container is multi-arch,
    # so this is no longer constrained to x86-only pools.
    runs-on: ubuntu-latest
    # Fail fast instead of letting a stuck step (e.g. a hung browser install) run
    # until GitHub's 6-hour default job timeout. plugin-events runs many browser
    # projects sequentially, while product-category includes bounded waits for
    # remote catalog propagation, so both receive a larger budget.
    timeout-minutes: ${{ matrix.test-group == 'plugin-events' && 90 || matrix.test-group == 'product-category' && 90 || 45 }}

    strategy:
      fail-fast: false
      # Cap how many shards run concurrently within a run to keep shared-test-asset
      # contention reasonable (all shards now share the ubuntu-latest pool).
      max-parallel: 8
      matrix:
        test-group: ['plugin-events', 'product-crud', 'variable-product-depth', 'product-batch', 'product-category', 'performance-sync']
        version-set: ['supported', 'latest']
        include:
          - version-set: 'supported'
            wp-version: ${{ needs.resolve-versions.outputs.wp-supported }}
            wc-version: ${{ needs.resolve-versions.outputs.wc-supported }}
            version-label: 'Currently supported'
          - version-set: 'latest'
            wp-version: 'latest'
            wc-version: 'latest'
            version-label: 'Latest'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # 'latest' (not a pinned version) so E2E runs on the newest stable PHP as
          # soon as it releases — surfacing incompatibilities with new PHP versions
          # early. Trade-off: a new PHP release can turn E2E red until the plugin is
          # made compatible.
          php-version: 'latest'
          extensions: mysqli, zip, gd, curl, dom, fileinfo, mbstring
          ini-values: |
            date.timezone=UTC
            memory_limit=1024M
            max_execution_time=300

      - name: Configure hostname
        run: |
          # Add hosts entry for custom domain
          echo "127.0.0.1 ${{ env.TEST_SITE_HOST }}" | sudo tee -a /etc/hosts
          echo "✅ Added hosts entry for ${{ env.TEST_SITE_HOST }}"

      - name: Create WordPress test environment
        run: |
          # Create WordPress directory
          mkdir -p ${{ env.WORDPRESS_PATH }}
          cd ${{ env.WORDPRESS_PATH }}

          # Download WordPress
          if [ "${{ matrix.wp-version }}" = "latest" ]; then
            curl -O https://wordpress.org/latest.tar.gz
            tar -xzf latest.tar.gz --strip-components=1
          else
            curl -O https://wordpress.org/wordpress-${{ matrix.wp-version }}.tar.gz
            tar -xzf wordpress-${{ matrix.wp-version }}.tar.gz --strip-components=1
          fi

          # Create wp-config.php
          cp wp-config-sample.php wp-config.php
          sed -i "s/database_name_here/wordpress/" wp-config.php
          sed -i "s/username_here/wordpress/" wp-config.php
          sed -i "s/password_here/wordpress/" wp-config.php
          sed -i "s/localhost/127.0.0.1/" wp-config.php

          # Enable debug logging by replacing wp-config-sample.php's own WP_DEBUG
          # define IN PLACE, before wp-settings.php loads. We must not append a second
          # define('WP_DEBUG', ...): PHP keeps the first definition (the sample's
          # `false`) and emits "Constant WP_DEBUG already defined" — rendered as
          # "...this will be an error in PHP 9" on PHP 8.3+, whose word "error" tripped
          # the debug.log error scan and failed every E2E shard on newer PHP. For the
          # same reason we no longer append duplicate salt/key defines: the sample
          # already defines all eight, so its placeholder values remain in effect.
          sed -i -E "s|^[[:space:]]*define. *.WP_DEBUG., *false.*|define( 'WP_DEBUG', true );\ndefine( 'WP_DEBUG_LOG', true );\ndefine( 'WP_DEBUG_DISPLAY', false );\n@ini_set( 'error_log', '${{ env.WP_DEBUG_LOG }}' );\n@ini_set( 'log_errors', 'On' );|" wp-config.php

          # Set deterministic testing salts/keys by replacing wp-config-sample.php's
          # placeholder defines IN PLACE (same reason as WP_DEBUG: appending duplicates
          # them, which PHP ignores while warning "already defined"). The 'NAME', anchor
          # keeps AUTH_KEY from also matching SECURE_AUTH_KEY.
          sed -i -E "s|^[[:space:]]*define. *'AUTH_KEY',.*|define( 'AUTH_KEY', 'testing-key-1' );|" wp-config.php
          sed -i -E "s|^[[:space:]]*define. *'SECURE_AUTH_KEY',.*|define( 'SECURE_AUTH_KEY', 'testing-key-2' );|" wp-config.php
          sed -i -E "s|^[[:space:]]*define. *'LOGGED_IN_KEY',.*|define( 'LOGGED_IN_KEY', 'testing-key-3' );|" wp-config.php
          sed -i -E "s|^[[:space:]]*define. *'NONCE_KEY',.*|define( 'NONCE_KEY', 'testing-key-4' );|" wp-config.php
          sed -i -E "s|^[[:space:]]*define. *'AUTH_SALT',.*|define( 'AUTH_SALT', 'testing-salt-1' );|" wp-config.php
          sed -i -E "s|^[[:space:]]*define. *'SECURE_AUTH_SALT',.*|define( 'SECURE_AUTH_SALT', 'testing-salt-2' );|" wp-config.php
          sed -i -E "s|^[[:space:]]*define. *'LOGGED_IN_SALT',.*|define( 'LOGGED_IN_SALT', 'testing-salt-3' );|" wp-config.php
          sed -i -E "s|^[[:space:]]*define. *'NONCE_SALT',.*|define( 'NONCE_SALT', 'testing-salt-4' );|" wp-config.php

      - name: Wordpress debug log file setup
        run: |
          # Create debug.log file and make it writable
          touch ${{ env.WP_DEBUG_LOG }}
          chmod 777 ${{ env.WP_DEBUG_LOG }}
          echo "✅ debug.log created and writable"

      - name: WooCommerce logs directory setup
        run: |
          # Create WooCommerce logs directory and make it writable
          mkdir -p ${{ env.WORDPRESS_PATH }}/wp-content/uploads/wc-logs
          chmod 777 ${{ env.WORDPRESS_PATH }}/wp-content/uploads/wc-logs
          echo "✅ wc-logs directory created and writable"


      - name: Start PHP server
        run: |
          cd ${{ env.WORDPRESS_PATH }}
          php -S 127.0.0.1:8080 -t . &
          echo $! > /tmp/php-server.pid
          sleep 5
          echo "✅ PHP server started on port 8080"

      - name: Install WP-CLI
        run: |
          echo "=== Installing WP-CLI ==="
          curl -L -o wp-cli.phar https://github.com/wp-cli/wp-cli/releases/download/v2.10.0/wp-cli-2.10.0.phar

          if head -1 wp-cli.phar | grep -q "#!/usr/bin/env php"; then
            chmod +x wp-cli.phar
            sudo mv wp-cli.phar /usr/local/bin/wp
            echo "✅ WP-CLI installed successfully"
          else
            echo "❌ Downloaded file is not valid PHP"
            exit 1
          fi

          wp --version

      - name: Install WordPress
        run: |
          cd ${{ env.WORDPRESS_PATH }}
          wp core install \
            --url=http://${{ env.TEST_SITE_HOST }}:8080 \
            --title="E2E Test Site" \
            --admin_user=admin \
            --admin_password=admin \
            --admin_email=test@example.com \
            --allow-root

      - name: Install WooCommerce
        run: |
          cd ${{ env.WORDPRESS_PATH }}

          # Install Storefront theme (official WooCommerce theme with all hooks)
          wp theme install storefront --activate --allow-root
          echo "✅ Storefront theme installed and activated"
          # Install Twenty Twenty-Five theme (default WP theme to ensure compatibility with non-WooCommerce themes)
          wp theme install twentytwentyfive --allow-root
          echo "✅ Twenty Twenty-Five theme installed"
          if [ "${{ matrix.wc-version }}" = "latest" ]; then
            wp plugin install woocommerce --activate --allow-root
          else
            # Resolve major.minor to the latest patch version (e.g., 10.5 → 10.5.2)
            WC_INSTALL_VERSION=$(curl -s 'https://api.wordpress.org/plugins/info/1.0/woocommerce.json' | jq -r --arg prefix "${{ matrix.wc-version }}." '[.versions | keys[] | select(startswith($prefix)) | select(test("-") | not)] | sort_by(split(".") | map(tonumber)) | last')
            if [ -z "$WC_INSTALL_VERSION" ] || [ "$WC_INSTALL_VERSION" = "null" ]; then
              WC_INSTALL_VERSION="${{ matrix.wc-version }}"
            fi
            echo "Resolved WC version: ${{ matrix.wc-version }} → $WC_INSTALL_VERSION"
            wp plugin install woocommerce --version=$WC_INSTALL_VERSION --activate --allow-root
          fi

          # Basic WooCommerce setup
          wp option update woocommerce_store_address "${{ env.STORE_ADDRESS }}" --allow-root
          wp option update woocommerce_store_city "${{ env.STORE_CITY }}" --allow-root
          wp option update woocommerce_default_country "${{ env.STORE_COUNTRY }}" --allow-root
          wp option update woocommerce_store_postcode "${{ env.STORE_POSTCODE }}" --allow-root
          wp option update woocommerce_currency "${{ env.STORE_CURRENCY }}" --allow-root

          # Make site live (disable "Coming Soon" mode)
          wp option update woocommerce_coming_soon "no" --allow-root
          wp option update woocommerce_store_pages_only "no" --allow-root
          echo "✅ WooCommerce site set to LIVE mode"

          # Enable Cash on Delivery payment gateway
          wp option update woocommerce_cod_settings '{"enabled":"yes","title":"Cash on delivery","description":"Pay with cash upon delivery."}' --format=json --allow-root
          echo "✅ Cash on Delivery payment gateway enabled"

      - name: Verify WooCommerce setup
        run: |
          cd ${{ env.WORDPRESS_PATH }}
          # Check if WooCommerce is active
          if ! wp plugin list --status=active --allow-root | grep -q "woocommerce"; then
            echo "❌ WooCommerce is not active"
            exit 1
          fi
          echo "✅ WooCommerce is active"
          # Verify WooCommerce endpoints
          for endpoint in shop cart checkout; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${{ env.TEST_SITE_HOST }}:8080/$endpoint")
            if [ "$STATUS" -lt 400 ]; then
              echo "✅ /$endpoint endpoint exists (status: $STATUS)"
            else
              echo "❌ /$endpoint endpoint not found (status: $STATUS)"
            fi
          done

      - name: Create wp non admin user
        run: |
          cd ${{ env.WORDPRESS_PATH }}
          # Create a customer (non-admin) user for testing
          # Pixel tracking excludes admin users by default!
          # Note: customer role is created by WooCommerce, so this step must run AFTER WooCommerce installation
          wp user create ${{ env.WP_CUSTOMER_USERNAME}} ${{ env.WP_CUSTOMER_EMAIL }} --role=customer --user_pass=${{ env.WP_CUSTOMER_PASSWORD }} --allow-root || echo "Customer user already exists"

          # Grant read capability to customer role (for viewing products/categories)
          # This ensures customer can see shop pages, products, and categories
          wp cap add customer read --allow-root

          # Get customer user ID once and store it
          CUSTOMER_ID=$(wp user get ${{ env.WP_CUSTOMER_EMAIL }} --field=ID --allow-root)
          echo "Customer User ID: $CUSTOMER_ID"

          # Add billing address to customer user for comprehensive event testing
          # This ensures address fields (ct, zp, country) are captured in Pixel/CAPI events
          wp user meta update $CUSTOMER_ID billing_first_name "${{ env.TEST_USER_FIRST_NAME }}" --allow-root
          wp user meta update $CUSTOMER_ID billing_last_name "${{ env.TEST_USER_LAST_NAME }}" --allow-root
          wp user meta update $CUSTOMER_ID billing_company "" --allow-root
          wp user meta update $CUSTOMER_ID billing_address_1 "${{ env.TEST_USER_ADDRESS_1 }}" --allow-root
          wp user meta update $CUSTOMER_ID billing_address_2 "${{ env.TEST_USER_ADDRESS_2 }}" --allow-root
          wp user meta update $CUSTOMER_ID billing_city "${{ env.TEST_USER_CITY }}" --allow-root
          wp user meta update $CUSTOMER_ID billing_state "${{ env.TEST_USER_STATE }}" --allow-root
          wp user meta update $CUSTOMER_ID billing_postcode "${{ env.TEST_USER_POSTCODE }}" --allow-root
          wp user meta update $CUSTOMER_ID billing_country "${{ env.TEST_USER_COUNTRY }}" --allow-root
          wp user meta update $CUSTOMER_ID billing_email "${{ env.WP_CUSTOMER_EMAIL }}" --allow-root
          wp user meta update $CUSTOMER_ID billing_phone "${{ env.TEST_USER_PHONE }}" --allow-root

          # Set shipping address same as billing (WooCommerce stores them separately)
          wp user meta update $CUSTOMER_ID shipping_first_name "${{ env.TEST_USER_FIRST_NAME }}" --allow-root
          wp user meta update $CUSTOMER_ID shipping_last_name "${{ env.TEST_USER_LAST_NAME }}" --allow-root
          wp user meta update $CUSTOMER_ID shipping_company "" --allow-root
          wp user meta update $CUSTOMER_ID shipping_address_1 "${{ env.TEST_USER_ADDRESS_1 }}" --allow-root
          wp user meta update $CUSTOMER_ID shipping_address_2 "${{ env.TEST_USER_ADDRESS_2 }}" --allow-root
          wp user meta update $CUSTOMER_ID shipping_city "${{ env.TEST_USER_CITY }}" --allow-root
          wp user meta update $CUSTOMER_ID shipping_state "${{ env.TEST_USER_STATE }}" --allow-root
          wp user meta update $CUSTOMER_ID shipping_postcode "${{ env.TEST_USER_POSTCODE }}" --allow-root
          wp user meta update $CUSTOMER_ID shipping_country "${{ env.TEST_USER_COUNTRY }}" --allow-root

          echo "✅ Customer user created with billing and shipping address"

          # Verify billing address was set correctly
          echo "=== Verifying Billing Address ==="
          echo "City: $(wp user meta get $CUSTOMER_ID billing_city --allow-root)"
          echo "State: $(wp user meta get $CUSTOMER_ID billing_state --allow-root)"
          echo "Postcode: $(wp user meta get $CUSTOMER_ID billing_postcode --allow-root)"
          echo "Country: $(wp user meta get $CUSTOMER_ID billing_country --allow-root)"
          echo "Email: $(wp user meta get $CUSTOMER_ID billing_email --allow-root)"

      - name: Install WPC Composite Products plugin
        run: |
          cd ${{ env.WORDPRESS_PATH }}
          wp plugin install wpc-composite-products --activate --allow-root

      - name: Check logs baseline (before plugin activation)
        run: |
          TODAY=$(date +%Y-%m-%d)

          # Find WC log file
          WC_LOG_FILE=$(find "${{ env.WORDPRESS_PATH }}/wp-content/uploads/wc-logs/" -name "facebook_for_woocommerce-${TODAY}*.log" -type f 2>/dev/null | head -1)

          # Check WC log if exists
          if [ -n "$WC_LOG_FILE" ]; then
            echo "🔍 Checking WC log: $WC_LOG_FILE for errors..."
            NON_200=$(grep "code: " "$WC_LOG_FILE" | grep -v "code: 200" || true)
            if [ -n "$NON_200" ]; then
              echo "❌ FAIL: Found non-200 codes in $WC_LOG_FILE:"
              echo "$NON_200"
              exit 1
            fi
          fi

          # Check debug.log
          echo "🔍 Checking debug.log: ${{ env.WP_DEBUG_LOG }} for errors..."
          ERRORS=$(grep -i "fatal\|error" "${{ env.WP_DEBUG_LOG }}" | grep -v "Cron reschedule event error" || true)
          if [ -n "$ERRORS" ]; then
            echo "❌ FAIL: Found errors in ${{ env.WP_DEBUG_LOG }}:"
            echo "$ERRORS"
            exit 1
          fi

          echo "✅ PASS: No errors found in logs"

      - name: Select Meta Business Assets
        run: |
          # Parse the JSON array of business assets
          ASSETS='${{ secrets.FB_TEST_META_BUSINESS_ASSETS }}'

          # Get the array length
          ARRAY_LENGTH=$(echo "$ASSETS" | jq 'length')
          echo "Total available business asset sets: $ARRAY_LENGTH"

          # Product category assertions depend on asynchronous catalog reads.
          # Keep the supported and latest category shards away from the asset
          # used by the rest of this workflow run, reducing unrelated catalog
          # writes while product-set membership propagates.
          REQUIRED_ASSET_COUNT=3
          if [ "$ARRAY_LENGTH" -lt "$REQUIRED_ASSET_COUNT" ]; then
            echo "::error title=E2E Assets Missing::Product category isolation requires at least $REQUIRED_ASSET_COUNT asset sets, found $ARRAY_LENGTH."
            exit 1
          fi

          # Rotate the base asset between workflow runs and reruns. Category
          # shards receive separate offsets so all three lanes are distinct.
          SELECTOR=$(( ${{ github.run_number }} + ${{ github.run_attempt }} - 1 ))
          ASSET_OFFSET=0
          if [ "${{ matrix.test-group }}" = "product-category" ]; then
            if [ "${{ matrix.version-set }}" = "supported" ]; then
              ASSET_OFFSET=1
            else
              ASSET_OFFSET=2
            fi
          fi
          SELECTOR=$((SELECTOR + ASSET_OFFSET))
          echo "Using asset selector $SELECTOR (offset $ASSET_OFFSET)"

          # Calculate index using modulo
          INDEX=$((SELECTOR % ARRAY_LENGTH))
          echo "Selected asset set index: $INDEX"

          # Extract the selected asset set
          SELECTED_ASSET=$(echo "$ASSETS" | jq -c ".[$INDEX]")

          # Extract values into variables
          ACCESS_TOKEN=$(echo "$SELECTED_ASSET" | jq -r '.wc_facebook_access_token')
          BUSINESS_MANAGER_ID=$(echo "$SELECTED_ASSET" | jq -r '.wc_facebook_business_manager_id')
          EXTERNAL_BUSINESS_ID=$(echo "$SELECTED_ASSET" | jq -r '.wc_facebook_external_business_id')
          PRODUCT_CATALOG_ID=$(echo "$SELECTED_ASSET" | jq -r '.wc_facebook_product_catalog_id')
          PIXEL_ID=$(echo "$SELECTED_ASSET" | jq -r '.wc_facebook_pixel_id')
          PAGE_ID=$(echo "$SELECTED_ASSET" | jq -r '.wc_facebook_page_id')

          # Mask all sensitive values to prevent them from appearing in logs
          echo "::add-mask::$ACCESS_TOKEN"
          echo "::add-mask::$BUSINESS_MANAGER_ID"
          echo "::add-mask::$EXTERNAL_BUSINESS_ID"
          echo "::add-mask::$PRODUCT_CATALOG_ID"
          echo "::add-mask::$PIXEL_ID"
          echo "::add-mask::$PAGE_ID"

          # Set environment variables for subsequent steps
          echo "FB_ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
          echo "FB_BUSINESS_MANAGER_ID=$BUSINESS_MANAGER_ID" >> $GITHUB_ENV
          echo "FB_EXTERNAL_BUSINESS_ID=$EXTERNAL_BUSINESS_ID" >> $GITHUB_ENV
          echo "FB_PRODUCT_CATALOG_ID=$PRODUCT_CATALOG_ID" >> $GITHUB_ENV
          echo "FB_PIXEL_ID=$PIXEL_ID" >> $GITHUB_ENV
          echo "FB_PAGE_ID=$PAGE_ID" >> $GITHUB_ENV

          echo "✅ Selected business asset set $INDEX for this run"

      - name: Install Meta for WooCommerce plugin
        run: |
          cd ${{ env.WORDPRESS_PATH }}

          # Use marketplace version if flag is true
          if [ "${{ inputs.use-marketplace-version }}" = "true" ]; then
            echo "Installing Meta for WooCommerce from wordpress.org marketplace"
            wp plugin install facebook-for-woocommerce --version=dev --allow-root
          else
            echo "Installing Meta for WooCommerce from local workspace"
            # Copy plugin files from the checked out repository root
            cp -r ${{ github.workspace }} wp-content/plugins/facebook-for-woocommerce/

            # Install Composer dependencies for the plugin
            cd ${{ env.PLUGIN_PATH }}
            if [ -f composer.json ]; then
              composer install --no-dev --optimize-autoloader
            fi
            cd ${{ env.WORDPRESS_PATH }}
          fi

          # Configure Meta connection before activation using selected business assets
          wp option update wc_facebook_access_token "${{ env.FB_ACCESS_TOKEN }}" --allow-root
          wp option update wc_facebook_merchant_access_token "${{ env.FB_ACCESS_TOKEN }}" --allow-root
          wp option update wc_facebook_business_manager_id "${{ env.FB_BUSINESS_MANAGER_ID }}" --allow-root
          wp option update wc_facebook_external_business_id "${{ env.FB_EXTERNAL_BUSINESS_ID }}" --allow-root
          wp option update wc_facebook_product_catalog_id "${{ env.FB_PRODUCT_CATALOG_ID }}" --allow-root
          wp option update wc_facebook_pixel_id "${{ env.FB_PIXEL_ID }}" --allow-root
          wp option update wc_facebook_page_id "${{ env.FB_PAGE_ID }}" --allow-root
          wp option update wc_facebook_enable_server_to_server "yes" --allow-root
          wp option update wc_facebook_enable_pixel "yes" --allow-root
          wp option update wc_facebook_enable_advanced_matching "yes" --allow-root
          wp option update wc_facebook_debug_mode yes --allow-root
          wp option update wc_facebook_enable_debug_mode yes --allow-root
          wp option update wc_facebook_has_connected_fbe_2 "yes" --allow-root
          wp option update wc_facebook_has_authorized_pages_read_engagement "yes" --allow-root
          wp option update wc_facebook_enable_product_sync "yes" --allow-root

          # Activate the plugin (this triggers automatic sync)
          wp plugin activate facebook-for-woocommerce --allow-root

      - name: Verify no new errors after plugin activation
        run: |
          TODAY=$(date +%Y-%m-%d)

          # Find WC log file
          WC_LOG_FILE=$(find "${{ env.WORDPRESS_PATH }}/wp-content/uploads/wc-logs/" -name "facebook_for_woocommerce-${TODAY}*.log" -type f 2>/dev/null | head -1)

          # Check WC log if exists
          if [ -n "$WC_LOG_FILE" ]; then
            echo "🔍 Checking WC log: $WC_LOG_FILE for errors..."
            NON_200=$(grep "code: " "$WC_LOG_FILE" | grep -v "code: 200" || true)
            if [ -n "$NON_200" ]; then
              echo "❌ FAIL: Found non-200 codes in $WC_LOG_FILE:"
              echo "$NON_200"
              exit 1
            fi
          fi

          # Check debug.log
          echo "🔍 Checking debug.log: ${{ env.WP_DEBUG_LOG }} for errors..."
          ERRORS=$(grep -i "fatal\|error" "${{ env.WP_DEBUG_LOG }}" | grep -v "Cron reschedule event error" || true)
          if [ -n "$ERRORS" ]; then
            echo "❌ FAIL: Found errors in ${{ env.WP_DEBUG_LOG }}:"
            echo "$ERRORS"
            exit 1
          fi

          echo "✅ PASS: No errors found in logs"

      - name: Initialize rollout switches for E2E tests
        run: |
            cd ${{ env.WORDPRESS_PATH }}
            # Force initialize rollout switches - this would normally happen on heartbeat
            wp eval "
              if (function_exists('facebook_for_woocommerce')) {
                  \$plugin = facebook_for_woocommerce();
                  \$rollout_switches = \$plugin->get_rollout_switches();
                  \$rollout_switches->init();
                  echo '✅ Rollout switches initialized' . PHP_EOL;
              }" --allow-root

            # Manually enable CAPI event logging for E2E tests
            # This is required for test event capture to work
            wp eval "
              \$switches = get_option('wc_facebook_for_woocommerce_rollout_switches', []);
              \$switches['enable_woocommerce_capi_event_logging'] = 'yes';
              update_option('wc_facebook_for_woocommerce_rollout_switches', \$switches);
              echo '✅ CAPI event logging enabled for E2E tests' . PHP_EOL;
              " --allow-root

      - name: Verify WordPress setup
        run: |
          cd ${{ env.WORDPRESS_PATH }}
          echo "=== WordPress Info ==="
          wp core version --allow-root
          echo "=== Active Plugins ==="
          wp plugin list --status=active --allow-root
          echo "=== Site URL ==="
          wp option get siteurl --allow-root

          # Test if site is accessible
          curl -f http://${{ env.TEST_SITE_HOST }}:8080 || exit 1

      - name: Verify Meta for WooCommerce setup
        run: |
          cd ${{ env.WORDPRESS_PATH }}
          echo "=== Meta for WooCommerce Info ==="
          wp eval "
            if (function_exists('facebook_for_woocommerce')) {
                \$connection = facebook_for_woocommerce()->get_connection_handler();
                if (!\$connection->is_connected()) {
                    echo '❌ Meta plugin is NOT connected' . PHP_EOL;
                    exit(1);
                }
                echo 'Connected: YES' . PHP_EOL;
                echo 'Access Token: ' . (\$connection->get_access_token() ? 'Present' : 'Missing') . PHP_EOL;
                echo 'External Business ID: ' . \$connection->get_external_business_id() . PHP_EOL;
                echo 'Business Manager ID: ' . \$connection->get_business_manager_id() . PHP_EOL;
                echo 'Pixel ID: ' . get_option('wc_facebook_pixel_id') . PHP_EOL;
                echo 'Pixel Enabled: ' . get_option('wc_facebook_enable_pixel') . PHP_EOL;
                echo 'S2S Enabled: ' . get_option('wc_facebook_enable_server_to_server') . PHP_EOL;
                echo 'Debug Mode: ' . get_option('wc_facebook_debug_mode') . PHP_EOL;
            } else {
                echo '❌ Meta plugin not loaded properly' . PHP_EOL;
                exit(1);
            }" --allow-root

          # VERIFY wp-config.php has debug settings
          echo "=== Verifying wp-config.php Debug Settings ==="
          if grep -q "WP_DEBUG.*true" wp-config.php; then
            echo "✅ WP_DEBUG is enabled"
          else
            echo "❌ WP_DEBUG is NOT enabled!"
            exit 1
          fi

      - name: Install Playwright
        env:
          # The branded Google Chrome channel is installed through the system
          # package manager (apt). Force non-interactive mode so apt/debconf can
          # never block on a prompt.
          DEBIAN_FRONTEND: noninteractive
          # Keep Playwright install logs verbose to diagnose any future hangs.
          DEBUG: pw:install
        run: |
          # Install in the WordPress plugin directory (where we'll run tests from)
          cd ${{ env.PLUGIN_PATH }}
          npm install

          # GitHub's runner image pre-installs Microsoft/azure-cli apt repos
          # (packages.microsoft.com) that our tests never use. They periodically
          # serve invalid repo metadata, which makes `apt-get update` fail with
          # exit 100 and takes the whole `--with-deps` browser install down with
          # it. Drop any apt source pointing at packages.microsoft.com so a broken
          # Microsoft mirror can't fail our tests. The plugin-events group re-adds
          # its own Edge repo later, after this step, so this is safe for all
          # groups.
          sudo grep -rlZ 'packages\.microsoft\.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -0 -r rm -f || true

          # Bundled browsers (chromium) download to the Playwright cache without
          # root; the branded Chrome channel needs OS deps installed via apt.
          # Use a single non-interactive `--with-deps` invocation so deps are
          # installed in the right order, and cap it with a timeout so a stuck
          # apt step fails fast instead of hanging the whole job.
          timeout 15m npx playwright install --with-deps chromium chrome

          # Plugin-events also exercises WebKit (Safari-like) and Firefox.
          if [ "${{ matrix.test-group }}" = "plugin-events" ]; then
            timeout 15m npx playwright install --with-deps webkit firefox
          fi

      - name: Verify WebKit browser setup
        if: matrix.test-group == 'plugin-events'
        run: |
          cd ${{ env.PLUGIN_PATH }}
          node - <<'NODE'
          const { webkit } = require('playwright');

          (async () => {
            const browser = await webkit.launch({ headless: true });
            try {
              const version = browser.version();
              const context = await browser.newContext({ ignoreHTTPSErrors: true });
              const page = await context.newPage();
              await page.goto(process.env.WORDPRESS_URL, { waitUntil: 'domcontentloaded', timeout: 120000 });
              console.log(`✅ WebKit launched successfully. Version: ${version}`);
            } finally {
              await browser.close();
            }
          })().catch((err) => {
            console.error('❌ WebKit verification failed:', err?.message || err);
            process.exit(1);
          });
          NODE

      - name: Install Edge browser
        if: matrix.test-group == 'plugin-events'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y wget gpg
          wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > microsoft.gpg
          sudo install -o root -g root -m 644 microsoft.gpg /usr/share/keyrings/microsoft.gpg
          echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
          sudo apt-get update
          sudo apt-get install -y microsoft-edge-stable
          echo "EDGE_EXECUTABLE_PATH=/usr/bin/microsoft-edge-stable" >> $GITHUB_ENV

      - name: Verify Edge browser setup
        if: matrix.test-group == 'plugin-events'
        run: |
          set -e
          test -x /usr/bin/microsoft-edge-stable
          /usr/bin/microsoft-edge-stable --version


      - name: Install Brave browser
        if: matrix.test-group == 'plugin-events'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y curl gnupg
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg \
            https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" | \
            sudo tee /etc/apt/sources.list.d/brave-browser-release.list
          sudo apt-get update
          sudo apt-get install -y brave-browser
          echo "BRAVE_EXECUTABLE_PATH=/usr/bin/brave-browser" >> $GITHUB_ENV

      - name: Verify Brave browser setup
        if: matrix.test-group == 'plugin-events'
        run: |
          set -e
          test -x /usr/bin/brave-browser
          /usr/bin/brave-browser --version

      - name: Install Opera browser
        if: matrix.test-group == 'plugin-events'
        run: |
          set -e
          sudo apt-get update
          # gsettings-desktop-schemas is required by Opera in CI containers.
          # dbus-x11/libglib2.0-bin help with runtime diagnostics and schema tooling.
          sudo apt-get install -y wget gnupg2 gsettings-desktop-schemas dbus-x11 libglib2.0-bin
          wget -qO- https://deb.opera.com/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/opera.gpg
          echo "deb [signed-by=/usr/share/keyrings/opera.gpg] https://deb.opera.com/opera-stable/ stable non-free" | sudo tee /etc/apt/sources.list.d/opera-stable.list
          sudo apt-get update
          sudo apt-get install -y opera-stable

          OPERA_BIN="$(command -v opera-stable || command -v opera || true)"
          if [ -z "$OPERA_BIN" ]; then
            echo "❌ Opera binary not found after install" >&2
            exit 1
          fi
          echo "OPERA_EXECUTABLE_PATH=$OPERA_BIN" >> $GITHUB_ENV

      - name: Verify Opera browser setup
        if: matrix.test-group == 'plugin-events'
        run: |
          set -e
          OPERA_BIN="${OPERA_EXECUTABLE_PATH:-$(command -v opera-stable || command -v opera || true)}"
          if [ -z "$OPERA_BIN" ]; then
            echo "❌ OPERA_EXECUTABLE_PATH not set and no Opera binary found" >&2
            exit 1
          fi

          test -x "$OPERA_BIN"
          "$OPERA_BIN" --version || {
            echo "❌ Opera binary exists but failed to execute: $OPERA_BIN" >&2
            ldd "$OPERA_BIN" || true
            exit 1
          }

          echo "=== Opera runtime diagnostics ==="
          echo "OPERA_BIN=$OPERA_BIN"
          ldd "$OPERA_BIN" || true
          dpkg -l | grep -E 'opera|gsettings-desktop-schemas|libglib2.0|dbus' || true
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-<unset>}"
          echo "XDG_CURRENT_DESKTOP=${XDG_CURRENT_DESKTOP:-<unset>}"
          gsettings list-schemas | grep -E '^org\.gnome\.desktop\.background$' || true

          echo "=== Opera smoke launch under xvfb (for diagnostics) ==="
          set +e
          xvfb-run --auto-servernum bash -lc 'set -x; timeout 20s "$0" --no-sandbox --disable-gpu --user-data-dir=/tmp/opera-smoke-${RANDOM} --remote-debugging-port=0 about:blank' "$OPERA_BIN" \
            2>&1 | tee /tmp/opera-smoke.log
          SMOKE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "Opera smoke exit code: $SMOKE_EXIT"
          echo "(non-zero is tolerated here; real verdict comes from Playwright run)"

      - name: Setup captured-events directory
        if: matrix.test-group == 'plugin-events'
        run: |
          mkdir -p ${{ env.PLUGIN_PATH }}/tests/e2e/captured-events
          chmod 777 ${{ env.PLUGIN_PATH }}/tests/e2e/captured-events
      - name: Create test product for storefront event suites
        if: matrix.test-group == 'plugin-events'
        run: |
          cd ${{ env.WORDPRESS_PATH }}
          # Ensure deterministic product slug used by plugin-events suites.
          EXISTING_ID=$(wp post list --post_type=product --name=testp --field=ID --allow-root | head -n1)

          if [ -n "$EXISTING_ID" ]; then
            PRODUCT_ID="$EXISTING_ID"
            echo "ℹ️ Reusing existing test product. ID: $PRODUCT_ID"
          else
            PRODUCT_ID=$(wp eval "
              \$product = new WC_Product_Simple();
              \$product->set_name('TestP');
              \$product->set_slug('testp');
              \$product->set_regular_price('19.99');
              \$product->set_description('Test product for E2E tests');
              \$product->set_status('publish');
              \$product->set_catalog_visibility('visible');
              \$product->set_stock_status('instock');
              \$product->set_manage_stock(false);
              \$product_id = \$product->save();
              wp_set_object_terms(\$product_id, 'uncategorized', 'product_cat');
              echo \$product_id;
            " --allow-root)
            echo "✅ Test product created. ID: $PRODUCT_ID"
          fi

          echo "TEST_PRODUCT_ID=$PRODUCT_ID" >> $GITHUB_ENV

      - name: Install Xvfb for headed browser
        if: matrix.test-group == 'plugin-events'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run Plugin & Events tests
        if: matrix.test-group == 'plugin-events'
        env:
          IS_LATEST_WP: ${{ matrix.wp-version == 'latest' && 'true' || 'false' }}
          REQUIRE_REAL_EDGE: '1'
          REQUIRE_REAL_FIREFOX: '1'
          REQUIRE_REAL_BRAVE: '1'
          REQUIRE_REAL_OPERA: '1'
          FIREFOX_EXECUTABLE_PATH: ''
        run: |
          cd ${{ env.PLUGIN_PATH }}

          # This step runs a dozen browser projects back to back. The step shell is
          # `bash -e`, so the first non-zero exit used to abort everything after it:
          # a single failing project silently skipped the remaining projects and
          # reported them as neither passed nor failed. Collect failures instead and
          # fail once at the end, so every project always reports its own result.
          set +e
          failed_projects=()

          note_rc() {  # note_rc <exit-code> <label>
            if [ "$1" -eq 0 ]; then
              echo "✅ passed: $2"
            else
              echo "❌ failed: $2 (exit $1)"
              failed_projects+=("$2")
            fi
          }

          run_project() {  # run_project <label> <command...>
            local label="$1"
            shift
            echo "::group::E2E project: ${label}"
            "$@"
            local rc=$?
            echo "::endgroup::"
            note_rc "$rc" "${label}"
            return 0
          }

          run_project "plugin-level-tests (chromium-wp-admin)" \
            npx playwright test plugin-level-tests.spec.js --project=chromium-wp-admin --workers=1
          run_project "events (chromium-wp-customer)" \
            xvfb-run --auto-servernum npx playwright test events-test.spec.js --headed --project=chromium-wp-customer --workers=1
          run_project "events (chromium-wp-customer-classic-theme)" \
            xvfb-run --auto-servernum npx playwright test events-test.spec.js --headed --project=chromium-wp-customer-classic-theme --workers=1
          run_project "events (chromium-wp-customer-block-theme)" \
            xvfb-run --auto-servernum npx playwright test events-test.spec.js --headed --project=chromium-wp-customer-block-theme --workers=1
          run_project "events (chromium-privacy-sandbox-wp-customer)" \
            xvfb-run --auto-servernum npx playwright test events-test.spec.js --headed --project=chromium-privacy-sandbox-wp-customer --workers=1

          # Ensure the supported Privacy Sandbox API test is executed (not skipped) in CI.
          run_project "privacy-sandbox API report" bash -c '
            xvfb-run --auto-servernum npx playwright test events-test.spec.js \
              --headed \
              --project=chromium-privacy-sandbox-wp-customer \
              --workers=1 \
              --grep "Privacy Sandbox - Protected Audience API shape in Chromium" \
              --reporter=json > /tmp/privacy-sandbox-api-report.json
          '

          # Diagnostic probe: verify APIs are exposed in the privacy-sandbox browser runtime.
          node - <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              channel: 'chrome',
              headless: true,
              args: [
                '--enable-features=InterestGroupStorage,AdInterestGroupAPI,Fledge,RunAdAuction,PrivacySandboxAdsAPIsOverride',
                '--enable-blink-features=InterestGroupStorage,AdInterestGroupAPI,RunAdAuction',
                '--test-third-party-cookie-phaseout',
                ...(process.env.WORDPRESS_URL ? [`--unsafely-treat-insecure-origin-as-secure=${new URL(process.env.WORDPRESS_URL).origin}`] : []),
              ],
            });

            try {
              const context = await browser.newContext({ ignoreHTTPSErrors: true });
              const page = await context.newPage();
              await page.goto(process.env.WORDPRESS_URL, { waitUntil: 'domcontentloaded', timeout: 120000 });

              const probe = await page.evaluate(() => ({
                isSecureContext: typeof window !== 'undefined' ? window.isSecureContext : null,
                hasJoinAdInterestGroup: typeof navigator !== 'undefined' && typeof navigator.joinAdInterestGroup === 'function',
                hasRunAdAuction: typeof navigator !== 'undefined' && typeof navigator.runAdAuction === 'function',
                hasLeaveAdInterestGroup: typeof navigator !== 'undefined' && typeof navigator.leaveAdInterestGroup === 'function',
                userAgent: typeof navigator !== 'undefined' ? navigator.userAgent : null,
              }));

              const browserVersion = browser.version();
              console.log('Privacy Sandbox probe:', JSON.stringify({ browserVersion, ...probe }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch((err) => {
            console.error('Privacy Sandbox probe failed:', err?.message || err);
            process.exit(1);
          });
          NODE
          note_rc $? "privacy-sandbox capability probe"

          node - <<'NODE'
          const fs = require('fs');
          const rawReport = fs.readFileSync('/tmp/privacy-sandbox-api-report.json', 'utf8');

          // Some environments may prepend non-JSON stdout noise (for example from global setup logs).
          // Extract the outermost JSON object defensively before parsing.
          const firstBrace = rawReport.indexOf('{');
          const lastBrace = rawReport.lastIndexOf('}');
          if (firstBrace === -1 || lastBrace === -1 || lastBrace < firstBrace) {
            console.error('Could not locate JSON object in privacy sandbox report output.');
            process.exit(1);
          }

          let report;
          try {
            report = JSON.parse(rawReport.slice(firstBrace, lastBrace + 1));
          } catch (err) {
            console.error('Failed to parse privacy sandbox JSON report:', err.message);
            process.exit(1);
          }

          const apiTitles = new Set([
            'Privacy Sandbox - Protected Audience API shape in Chromium'
          ]);

          const statuses = [];
          const walkSuite = (suite) => {
            for (const spec of suite.specs || []) {
              // Playwright JSON reporter stores the human-readable test name on spec.title.
              // Some versions do not include title on items inside spec.tests.
              const specTitle = spec.title;
              if (!apiTitles.has(specTitle)) {
                continue;
              }

              for (const test of spec.tests || []) {
                for (const result of test.results || []) {
                  statuses.push(result.status);
                }
              }
            }
            for (const child of suite.suites || []) {
              walkSuite(child);
            }
          };

          for (const suite of report.suites || []) {
            walkSuite(suite);
          }

          if (statuses.length < 1) {
            console.error('Expected the Privacy Sandbox API test to run, but did not find it in JSON report.');
            process.exit(1);
          }

          if (statuses.includes('skipped')) {
            console.error('Privacy Sandbox API tests were skipped in CI. This is not allowed. Statuses:', statuses);
            process.exit(1);
          }

          console.log('Privacy Sandbox API test executed without skips. Statuses:', statuses);
          NODE
          note_rc $? "privacy-sandbox no-skip gate"

          run_project "events (edge-wp-customer)" \
            xvfb-run --auto-servernum npx playwright test events-test.spec.js --headed --project=edge-wp-customer --workers=1
          run_project "events (firefox-wp-customer)" \
            xvfb-run --auto-servernum npx playwright test events-test.spec.js --headed --project=firefox-wp-customer --workers=1
          run_project "events (brave-wp-customer)" \
            xvfb-run --auto-servernum npx playwright test events-test.spec.js --headed --project=brave-wp-customer --workers=1
          run_project "events (android-pixel-wp-customer)" \
            npx playwright test events-test.spec.js --project=android-pixel-wp-customer --workers=1
          run_project "events (safari-ios-wp-customer)" \
            npx playwright test events-test.spec.js --project=safari-ios-wp-customer --workers=1
          run_project "events (opera-wp-customer)" bash -c '
            set -o pipefail
            xvfb-run --auto-servernum npx playwright test events-test.spec.js --headed --project=opera-wp-customer --workers=1 2>&1 | tee /tmp/opera-playwright.log
          '

          if [ "${#failed_projects[@]}" -ne 0 ]; then
            echo "::error::${#failed_projects[@]} E2E project run(s) failed in this shard:"
            printf '::error::  - %s\n' "${failed_projects[@]}"
            exit 1
          fi
          echo "All E2E project runs in this shard passed."

      - name: Dump Opera diagnostics (always)
        if: always() && matrix.test-group == 'plugin-events'
        run: |
          echo "=== /tmp/opera-smoke.log (tail) ==="
          tail -n 200 /tmp/opera-smoke.log || true
          echo "=== /tmp/opera-playwright.log (tail) ==="
          tail -n 400 /tmp/opera-playwright.log || true

      - name: Cleanup test product
        if: always() && matrix.test-group == 'plugin-events'
        run: |
          cd ${{ env.WORDPRESS_PATH }}
          if [ -n "${{ env.TEST_PRODUCT_ID }}" ]; then
            wp post delete ${{ env.TEST_PRODUCT_ID }} --force --allow-root
            echo "✅ Test product ${{ env.TEST_PRODUCT_ID }} deleted"
          else
            echo "ℹ️ No test product to delete"
          fi

      - name: Run Product CRUD tests
        if: matrix.test-group == 'product-crud'
        run: |
          cd ${{ env.PLUGIN_PATH }}
          npx playwright test "product-(creation|modification|deletion).spec.js" --project=chromium-wp-admin --workers=2

      - name: Run Variable Product Depth tests
        if: matrix.test-group == 'variable-product-depth'
        run: |
          cd ${{ env.PLUGIN_PATH }}
          npx playwright test variable-product-depth.spec.js --project=chromium-wp-admin --workers=1

      - name: Run Product Batch tests
        if: matrix.test-group == 'product-batch'
        run: |
          cd ${{ env.PLUGIN_PATH }}
          npx playwright test product-batch.spec.js --project=chromium-wp-admin --workers=1

      - name: Run Product Category tests
        if: matrix.test-group == 'product-category'
        run: |
          cd ${{ env.PLUGIN_PATH }}
          npx playwright test product-category.spec.js --project=chromium-wp-admin --workers=1

      - name: Run Product Stress Sync tests
        if: matrix.test-group == 'performance-sync'
        run: |
          cd ${{ env.PLUGIN_PATH }}
          npx playwright test performance-sync.spec.js --project=chromium-wp-admin --workers=1

      - name: Disconnect from catalog
        if: always()
        run: |
          cd ${{ env.WORDPRESS_PATH }}
          wp eval "
            if (function_exists('facebook_for_woocommerce')) {
                \$connection = facebook_for_woocommerce()->get_connection_handler();
                if (\$connection->is_connected()) {
                    \$connection->disconnect();
                    echo '✅ Disconnected from catalog' . PHP_EOL;
                } else {
                    echo 'ℹ️ Already disconnected' . PHP_EOL;
                }
            }" --allow-root

      - name: Verify disconnection
        if: always()
        run: |
          cd ${{ env.WORDPRESS_PATH }}
          wp eval "
            if (function_exists('facebook_for_woocommerce')) {
                \$connection = facebook_for_woocommerce()->get_connection_handler();
                if (\$connection->is_connected()) {
                    echo '❌ Still connected' . PHP_EOL;
                    exit(1);
                }
                echo '✅ Verified disconnected' . PHP_EOL;
            }" --allow-root

      - name: Check for PHP errors, and dump debug log
        if: always()
        run: |
          if [ -f ${{ env.WP_DEBUG_LOG }} ]; then
            # Capture PHP errors in a variable (excluding WordPress cron warnings)
            PHP_ERRORS=$(grep -i "fatal\|error" ${{ env.WP_DEBUG_LOG }} | grep -v "Cron reschedule event error for hook: facebook_for_woocommerce_5_minute_heartbeat_cron" || true)
            if [ -n "$PHP_ERRORS" ]; then
              echo "❌ PHP errors detected:"
              echo "$PHP_ERRORS"
              exit 1
            else
              echo "✅ No critical PHP errors found"
            fi
          else
            echo "✅ No debug log found - no PHP errors"
          fi

      # Defence in depth for T286988560: a bug bounty researcher found a live system
      # user access token in the publicly downloadable woocommerce-logs artifact.
      # The plugin no longer logs credentials (see Framework\Api\SensitiveData), but
      # nothing leaves this job until it has been scrubbed and independently verified
      # clean. ::add-mask:: only hides secrets in console output, never in files.
      - name: Scrub credentials from artifact paths
        if: always()
        run: |
          set -uo pipefail

          # A credential parameter followed by a secret-length value. Anchored on the
          # parameter name so it does not fire on the base64-encoded images embedded
          # in playwright-report/index.html. Does not match an already-masked value,
          # because '*' is outside the value character class.
          CREDENTIAL_PATTERN='(access_token|merchant_access_token|page_access_token|system_user_access_token|client_secret|client_token|appsecret_proof)["'"'"']?[[:space:]]*[=:][[:space:]]*["'"'"']?[A-Za-z0-9_|.-]{20,}'

          # Every path that is uploaded as an artifact by the steps below.
          ARTIFACT_PATHS=(
            "${{ env.WORDPRESS_PATH }}/wp-content/uploads/wc-logs"
            "${{ env.WP_DEBUG_LOG }}"
            "${{ env.PLUGIN_PATH }}/playwright-report"
            "${{ env.PLUGIN_PATH }}/test-results"
            "${{ env.PLUGIN_PATH }}${{ env.FB_E2E_CAPTURED_EVENTS_DIR }}"
          )

          for target in "${ARTIFACT_PATHS[@]}"; do
            [ -e "$target" ] || continue

            # Exact secret value first — robust against any regex metacharacters.
            if [ -n "${FB_ACCESS_TOKEN:-}" ]; then
              # `|| true` because grep exits 1 when it finds nothing, which is the
              # healthy case and must not fail the step under `bash -e -o pipefail`.
              grep -rlF "$FB_ACCESS_TOKEN" "$target" 2>/dev/null | while read -r file; do
                perl -pi -e 'BEGIN { $t = $ENV{FB_ACCESS_TOKEN} } s/\Q$t\E/***MASKED***/g' "$file"
                echo "  scrubbed exact token from: $file"
              done || true
            fi

            # Then any other credential-carrying parameter, in case a different
            # secret reaches the logs. Matching on the parameter name rather than
            # on a bare token shape avoids false positives on the base64 image
            # data embedded in playwright-report/index.html.
            grep -rlE "$CREDENTIAL_PATTERN" "$target" 2>/dev/null | while read -r file; do
              perl -pi -e 's/((?:access_token|merchant_access_token|page_access_token|system_user_access_token|client_secret|client_token|appsecret_proof)["'"'"']?\s*[=:]\s*["'"'"']?)[A-Za-z0-9_|.-]{20,}/${1}***MASKED***/g' "$file"
              echo "  scrubbed credential parameter from: $file"
            done || true
          done

          echo "✅ Scrub pass complete"

      # Fail closed: if a credential survived the scrub, destroy the artifacts and
      # break the build rather than publish them. Only file names are printed here,
      # never matched content.
      - name: Verify artifact paths contain no credentials
        if: always()
        run: |
          set -uo pipefail
          leaked=0

          # Keep in sync with the scrub step above.
          CREDENTIAL_PATTERN='(access_token|merchant_access_token|page_access_token|system_user_access_token|client_secret|client_token|appsecret_proof)["'"'"']?[[:space:]]*[=:][[:space:]]*["'"'"']?[A-Za-z0-9_|.-]{20,}'

          ARTIFACT_PATHS=(
            "${{ env.WORDPRESS_PATH }}/wp-content/uploads/wc-logs"
            "${{ env.WP_DEBUG_LOG }}"
            "${{ env.PLUGIN_PATH }}/playwright-report"
            "${{ env.PLUGIN_PATH }}/test-results"
            "${{ env.PLUGIN_PATH }}${{ env.FB_E2E_CAPTURED_EVENTS_DIR }}"
          )

          for target in "${ARTIFACT_PATHS[@]}"; do
            [ -e "$target" ] || continue

            if [ -n "${FB_ACCESS_TOKEN:-}" ] && grep -rqF "$FB_ACCESS_TOKEN" "$target" 2>/dev/null; then
              echo "::error::Live access token found under $target"
              grep -rlF "$FB_ACCESS_TOKEN" "$target" 2>/dev/null | sed 's|^|  affected file: |'
              leaked=1
            fi

            if grep -rqE "$CREDENTIAL_PATTERN" "$target" 2>/dev/null; then
              echo "::error::Unmasked credential parameter found under $target"
              grep -rlE "$CREDENTIAL_PATTERN" "$target" 2>/dev/null | sed 's|^|  affected file: |'
              leaked=1
            fi
          done

          if [ "$leaked" -ne 0 ]; then
            echo "::error::Refusing to publish artifacts that contain a credential (see T286988560). Deleting them."
            for target in "${ARTIFACT_PATHS[@]}"; do
              rm -rf "$target"
            done
            exit 1
          fi

          echo "✅ No credentials found in any artifact path"

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report-${{ matrix.version-label }}-${{ matrix.test-group }}
          path: ${{ env.PLUGIN_PATH }}/playwright-report/
          retention-days: 7

      - name: Upload captured events
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: captured-events-${{ matrix.version-label }}-${{ matrix.test-group }}
          path: ${{ env.PLUGIN_PATH }}${{ env.FB_E2E_CAPTURED_EVENTS_DIR }}
          retention-days: 7

      - name: Cleanup captured events directory
        if: always() && matrix.test-group == 'plugin-events'
        run: |
          TARGET_DIR="${{ env.PLUGIN_PATH }}${{ env.FB_E2E_CAPTURED_EVENTS_DIR }}"
          if [ -d "$TARGET_DIR" ]; then
            rm -rf "$TARGET_DIR"
            echo "✅ Deleted captured events directory: $TARGET_DIR"
          else
            echo "ℹ️ Captured events directory not found: $TARGET_DIR"
          fi

      # Logs are only published when a run actually fails, and expire quickly.
      # They are the artifacts that leaked a live token in T286988560, so their
      # exposure window is kept as small as is still useful for debugging.
      - name: Upload PHP logs
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: php-debug-logs-${{ matrix.version-label }}-${{ matrix.test-group }}
          path: ${{ env.WP_DEBUG_LOG }}
          retention-days: 2

      - name: Upload WooCommerce logs
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: woocommerce-logs-${{ matrix.version-label }}-${{ matrix.test-group }}
          path: ${{ env.WORDPRESS_PATH }}/wp-content/uploads/wc-logs/facebook_for_woocommerce-*.log
          retention-days: 2

      - name: Upload test videos/screenshots
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-failures-${{ matrix.version-label }}-${{ matrix.test-group }}
          path: ${{ env.PLUGIN_PATH }}/test-results/
          retention-days: 7
